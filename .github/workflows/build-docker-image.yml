name: Build & Push Docker Toolchain Image

# Build the multi-toolchain image (m68k-elf-gcc + XC8 + analysis tools)
# ONCE and push it to GitHub Container Registry (ghcr.io).
# The firmware-release pipeline then just pulls this image (fast),
# instead of rebuilding crosstool-NG from source on every tag.
#
# Trigger:
#   - Manually (workflow_dispatch)
#   - On changes to Dockerfile or ct-ng.config on main

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'ct-ng.config'
      - 'build.sh'

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/essensys-builder

jobs:
  build-and-push:
    name: Build & Push Toolchain Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Skip XC8 by default (large, non-redistributable). BA build
          # will need a variant with XC8 — build separately if required.
          build-args: |
            SKIP_XC8=1
          tags: |
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "✓ Image pushed: ${{ env.IMAGE_NAME }}:latest"
          echo "Pull with: docker pull ${{ env.IMAGE_NAME }}:latest"
