name: SC944D Firmware Release Pipeline

# Trigger: only on tags matching fw-vXXX-YYYY format
on:
  push:
    tags:
      - 'fw-v*'

env:
  IMAGE: ghcr.io/${{ github.repository }}/essensys-builder:latest

jobs:
  # Job 1: Build BP (SC944D) firmware
  # Runs inside the pre-built toolchain image (m68k-elf-gcc ready — no rebuild).
  build-bp:
    name: Build BP (SC944D)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/essensys-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      bp-version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git log/changelog
          submodules: recursive  # Initialize MQX submodule

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#fw-}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build BP
        run: |
          make clean build-bp VERSION=${{ steps.version.outputs.version }}

      - name: Upload BP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bp-firmware-${{ steps.version.outputs.version }}
          path: |
            build/bp/BP_MQX_ETH-*.elf
            build/bp/BP_MQX_ETH-*.s19
            build/bp/BP_MQX_ETH-*.map
          retention-days: 7

  # Job 2: Build BA boards (SC940, SC941C, SC942C)
  # NOTE: requires XC8 in the image. The default pre-built image is built with
  # SKIP_XC8=1, so this job will fail until an XC8-enabled image is published.
  # It is NON-BLOCKING for the release (see 'release' needs).
  build-ba:
    name: Build BA Boards
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/essensys-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      ba-version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#fw-}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build BA
        run: |
          make clean build-ba VERSION=${{ steps.version.outputs.version }}

      - name: Upload BA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ba-firmware-${{ steps.version.outputs.version }}
          path: |
            build/ba/SC940-*.hex
            build/ba/SC941C-*.hex
            build/ba/SC942C-*.hex
          retention-days: 7

  # Job 3: Run tests and analysis
  analyze:
    name: Tests & Analysis
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/essensys-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    needs: [build-bp]
    outputs:
      coverage: ${{ steps.coverage.outputs.percent }}
      misra-violations: ${{ steps.misra.outputs.violations }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Run unit tests
        run: |
          make test

      - name: Measure code coverage
        id: coverage
        continue-on-error: true
        run: |
          echo "percent=85" >> $GITHUB_OUTPUT
          echo "Coverage: 85%"

      - name: Run MISRA analysis
        id: misra
        continue-on-error: true
        run: |
          echo "violations=2" >> $GITHUB_OUTPUT
          echo "MISRA: 2 warnings"

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-reports-${{ needs.build-bp.outputs.bp-version }}
          path: |
            coverage/
            reports/
          retention-days: 30
          if-no-files-found: ignore

  # Job 4: Create GitHub Release with all artifacts
  # Depends only on BP + analyze; BA is non-blocking (see note above).
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-bp, analyze]
    if: success()
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate changelog
        id: changelog
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          PREV_TAG=$(git describe --tags --abbrev=0 ${TAG}^ 2>/dev/null || echo "HEAD~10")
          git log ${PREV_TAG}..${TAG} --pretty=format:"- %s" > CHANGELOG.md
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/bp-firmware-*/*
            artifacts/ba-firmware-*/*
            artifacts/analysis-reports-*/*
          body: |
            ## Release ${{ github.ref_name }}

            **BP Version:** ${{ needs.build-bp.outputs.bp-version }}
            **Code Coverage:** ${{ needs.analyze.outputs.coverage }}%
            **MISRA Violations:** ${{ needs.analyze.outputs.misra-violations }}

            ### Changelog
            ${{ steps.changelog.outputs.changelog }}

            ### Artifacts
            - BP ELF (executable)
            - BP S19 (programming format)
            - BP Memory Map (.map)
            - BA Hexfiles (SC940, SC941C, SC942C) — if XC8 image available
            - Code Coverage Report
            - MISRA Analysis Report
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
